        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.4));
      }
    </style>
  </defs>
  <rect width="860" height="160" fill="transparent"/>
  <text class="name" x="430" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="300" fill="url(#textGrad)" text-anchor="middle" letter-spacing="2">Akilesh Kumar S</text>
  <text x="430" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="middle" letter-spacing="4">FULL-STACK ENGINEER &amp; AI BUILDER</text>
  <line x1="330" y1="140" x2="530" y2="140" stroke="#333333" stroke-width="1" />
</svg>
