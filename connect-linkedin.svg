<svg xmlns="http://www.w3.org/2000/svg" width="160" height="60">
  <defs>
    <linearGradient id="luxury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2023" />
      <stop offset="100%" stop-color="#0d0e11" />
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.4" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    .btn { fill: url(#luxury); stroke: #0077b5; stroke-width: 1.5px; transition: all 0.4s ease; cursor: pointer; }
    .txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #0077b5; pointer-events: none; transition: all 0.4s ease; letter-spacing: 2px; text-transform: uppercase; }
    .icon { stroke: #0077b5; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: all 0.4s ease; pointer-events: none; }
    .group:hover .btn { stroke: #0077b5; filter: url(#softGlow); fill: #0077b5; fill-opacity: 0.1; }
    .group:hover .txt { fill: #ffffff; }
    .group:hover .icon { stroke: #ffffff; }
  </style>
  <g class="group">
    <rect x="5" y="10" width="150" height="40" rx="20" class="btn" />
    <svg x="20" y="20" width="20" height="20" viewBox="0 0 24 24">
      <g class="icon">
        <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle>
      </g>
    </svg>
    <text x="50" y="34" class="txt">LinkedIn</text>
  </g>
</svg>