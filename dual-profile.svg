<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="860" height="220">
  <style>
    /* Terminal Styles */
    .terminal-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5px; }
    .header { fill: #161b22; }
    .text-code { font-family: "JetBrains Mono", Consolas, monospace; font-size: 12px; fill: #c9d1d9; }
    .keyword { fill: #ff7b72; }
    .string { fill: #a5d6ff; }
    .var { fill: #79c0ff; }
    .success { fill: #3fb950; font-weight: bold; }
    
    /* Typewriter CSS Reveal Blocks */
    .cover { fill: #0d1117; } /* Matches terminal background to hide text */
    
    @keyframes reveal {
      from { transform: translateX(0); }
      to { transform: translateX(400px); }
    }
    
    /* Stepped animations for authentic typing */
    .c1 { animation: reveal 0.3s steps(15, end) forwards 0.5s; }
    .c2 { animation: reveal 0.4s steps(25, end) forwards 1.0s; }
    .c3 { animation: reveal 0.4s steps(20, end) forwards 1.6s; }
    .c4 { animation: reveal 0.4s steps(25, end) forwards 2.2s; }
    .c5 { animation: reveal 0.4s steps(25, end) forwards 2.8s; }
    .c6 { animation: reveal 0.1s steps(5, end) forwards 3.4s; }
    .c7 { animation: reveal 0.4s steps(20, end) forwards 3.7s; }
    .c8 { animation: reveal 0.01s linear forwards 4.3s; }
    
    @keyframes blink { 
      0%, 50% { opacity: 1; } 
      51%, 100% { opacity: 0; } 
    }
    .cursor { fill: #c9d1d9; animation: blink 1s step-end infinite; }
    @keyframes showCursor { 0% { opacity: 0; } 100% { opacity: 1; } }
    .c-cursor { opacity: 0; animation: showCursor 0.1s forwards 4.4s; }

    /* Experience List Styles */
    .exp-title { font-family: "JetBrains Mono", Consolas, monospace; font-size: 13px; fill: #8B949E; letter-spacing: 2px; font-weight: bold; }
    .exp-role { font-family: "JetBrains Mono", Consolas, monospace; font-size: 14px; fill: #FFFFFF; font-weight: bold; }
    .exp-date { font-family: "JetBrains Mono", Consolas, monospace; font-size: 13px; fill: #8B949E; text-anchor: end; }
    .exp-skills { font-family: "JetBrains Mono", Consolas, monospace; font-size: 13px; fill: #8B949E; }
    .dot { fill: #58A6FF; }
  </style>

  <!-- ================= LEFT COLUMN: TERMINAL ================= -->
  <g>
    <rect width="420" height="218" x="1" y="1" rx="8" class="terminal-bg"/>
    <rect width="420" height="30" x="1" y="1" rx="8" class="header"/>
    <rect width="420" height="15" x="1" y="16" class="header"/>
    <line x1="1" y1="31" x2="421" y2="31" stroke="#30363d" stroke-width="1.5px" />
    
    <circle cx="18" cy="16" r="5" fill="#ff5f56"/>
    <circle cx="34" cy="16" r="5" fill="#ffbd2e"/>
    <circle cx="50" cy="16" r="5" fill="#27c93f"/>
    <text x="210" y="20" class="text-code" fill="#8b949e" font-size="11" text-anchor="middle">workspace/profile.py</text>

    <!-- Typing Code -->
    <g transform="translate(15, 55)" class="text-code">
      
      <!-- Line 1 -->
      <text y="12"><tspan class="keyword">import</tspan> sys</text>
      <rect x="0" y="0" width="400" height="15" class="cover c1" />
      
      <!-- Line 2 -->
      <text y="32"><tspan class="keyword">from</tspan> core <tspan class="keyword">import</tspan> Developer</text>
      <rect x="0" y="20" width="400" height="15" class="cover c2" />
      
      <!-- Line 3 -->
      <text y="62"><tspan class="var">akilesh</tspan> = Developer(</text>
      <rect x="0" y="50" width="400" height="15" class="cover c3" />
      
      <!-- Line 4 -->
      <text y="82">    name=<tspan class="string">"Akilesh Kumar S"</tspan>,</text>
      <rect x="0" y="70" width="400" height="15" class="cover c4" />

      <!-- Line 5 -->
      <text y="102">    role=<tspan class="string">"Full-Stack &amp; AI"</tspan></text>
      <rect x="0" y="90" width="400" height="15" class="cover c5" />
      
      <!-- Line 6 -->
      <text y="122">)</text>
      <rect x="0" y="110" width="400" height="15" class="cover c6" />

      <!-- Line 7 -->
      <text y="152"><tspan class="var">akilesh</tspan>.compile()</text>
      <rect x="0" y="140" width="400" height="15" class="cover c7" />

      <!-- Line 8 -->
      <text y="182"><tspan class="success">[SUCCESS]</tspan> System deployed.</text>
      <rect x="0" y="170" width="400" height="15" class="cover c8" />
      
      <!-- Blinking Cursor -->
      <rect x="185" y="171" width="7" height="13" class="cursor c-cursor"/>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: EXPERIENCE ================= -->
  <g transform="translate(450, 0)">
    <text x="0" y="30" class="exp-title">EXPERIENCE</text>

    <!-- Experience: Hexaware -->
    <text x="0" y="70" class="exp-role">Hexaware Technologies <tspan fill="#8B949E">—</tspan> SDE Intern</text>
    <text x="400" y="70" class="exp-date">Dec 2025 <tspan fill="#8B949E">—</tspan> Present</text>
    
    <text x="0" y="95" class="exp-skills">Spring Boot <tspan class="dot">·</tspan> React <tspan class="dot">·</tspan> MySQL</text>
    <text x="0" y="115" class="exp-skills">Scalable E-commerce Platforms</text>
    
    <text x="0" y="145" class="exp-skills" fill="#58A6FF" font-size="12">> System Integration &amp; Architecture</text>
  </g>

</svg>
