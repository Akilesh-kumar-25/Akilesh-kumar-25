<svg xmlns="http://www.w3.org/2000/svg" width="860" height="150" viewBox="0 0 860 150">
  <style>
    .tech {
      fill: #111;
      stroke: #222;
      stroke-width: 1;
      transition: all 0.3s ease;
      cursor: default;
    }
    .tech:hover {
      fill: #1a1a1a;
      stroke: #888;
      filter: drop-shadow(0 0 8px rgba(255,255,255,0.2));
    }
    .text {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 12px;
      font-weight: 500;
      fill: #888;
      pointer-events: none;
      transition: all 0.3s ease;
    }
    .group:hover .text {
      fill: #fff;
    }
  </style>

  <!-- Row 1 -->
  <g class="group" transform="translate(60, 20)"><rect class="tech" width="100" height="32" rx="4" /><text class="text" x="50" y="21" text-anchor="middle">JavaScript</text></g>
  <g class="group" transform="translate(170, 20)"><rect class="tech" width="100" height="32" rx="4" /><text class="text" x="50" y="21" text-anchor="middle">React</text></g>
  <g class="group" transform="translate(280, 20)"><rect class="tech" width="100" height="32" rx="4" /><text class="text" x="50" y="21" text-anchor="middle">Node.js</text></g>
  <g class="group" transform="translate(390, 20)"><rect class="tech" width="100" height="32" rx="4" /><text class="text" x="50" y="21" text-anchor="middle">Java</text></g>
  <g class="group" transform="translate(500, 20)"><rect class="tech" width="100" height="32" rx="4" /><text class="text" x="50" y="21" text-anchor="middle">Spring Boot</text></g>
  <g class="group" transform="translate(610, 20)"><rect class="tech" width="100" height="32" rx="4" /><text class="text" x="50" y="21" text-anchor="middle">Python</text></g>
  <g class="group" transform="translate(720, 20)"><rect class="tech" width="100" height="32" rx="4" /><text class="text" x="50" y="21" text-anchor="middle">C</text></g>

  <!-- Row 2 -->
  <g class="group" transform="translate(60, 60)"><rect class="tech" width="100" height="32" rx="4" /><text class="text" x="50" y="21" text-anchor="middle">PHP</text></g>
  <g class="group" transform="translate(170, 60)"><rect class="tech" width="100" height="32" rx="4" /><text class="text" x="50" y="21" text-anchor="middle">HTML5</text></g>
  <g class="group" transform="translate(280, 60)"><rect class="tech" width="100" height="32" rx="4" /><text class="text" x="50" y="21" text-anchor="middle">CSS3</text></g>
  <g class="group" transform="translate(390, 60)"><rect class="tech" width="100" height="32" rx="4" /><text class="text" x="50" y="21" text-anchor="middle">MongoDB</text></g>
  <g class="group" transform="translate(500, 60)"><rect class="tech" width="100" height="32" rx="4" /><text class="text" x="50" y="21" text-anchor="middle">MySQL</text></g>
  <g class="group" transform="translate(610, 60)"><rect class="tech" width="100" height="32" rx="4" /><text class="text" x="50" y="21" text-anchor="middle">AWS</text></g>
  <g class="group" transform="translate(720, 60)"><rect class="tech" width="100" height="32" rx="4" /><text class="text" x="50" y="21" text-anchor="middle">GitHub</text></g>

  <!-- Row 3 -->
  <g class="group" transform="translate(280, 100)"><rect class="tech" width="100" height="32" rx="4" /><text class="text" x="50" y="21" text-anchor="middle">Figma</text></g>
  <g class="group" transform="translate(390, 100)"><rect class="tech" width="100" height="32" rx="4" /><text class="text" x="50" y="21" text-anchor="middle">Photoshop</text></g>
  <g class="group" transform="translate(500, 100)"><rect class="tech" width="100" height="32" rx="4" /><text class="text" x="50" y="21" text-anchor="middle">VS Code</text></g>
</svg>
