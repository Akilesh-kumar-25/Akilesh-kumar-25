    <circle cx="40" cy="20" r="6" class="mac-yel" />
    <circle cx="60" cy="20" r="6" class="mac-grn" />
    <text x="370" y="25" class="text" fill="#8b949e" text-anchor="middle">Initializing Akilesh.SYS ... [OK]</text>
