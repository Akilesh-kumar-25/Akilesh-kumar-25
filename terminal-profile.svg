        .label { fill: #ffa657; font-weight: bold; font-family: 'Consolas', 'Courier New', monospace; font-size: 15px; }
        .category { fill: #58a6ff; font-weight: bold; font-family: 'Consolas', 'Courier New', monospace; font-size: 15px; }
        .divider { stroke: #30363d; stroke-width: 1px; }
        .mac-red { fill: #ff5f56; }
        .mac-yel { fill: #ffbd2e; }
        .mac-grn { fill: #27c93f; }
        .highlight-bullet { fill: #3fb950; font-size: 15px; font-weight: bold; }
